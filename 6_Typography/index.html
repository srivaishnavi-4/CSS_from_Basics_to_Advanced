<!DOCTYPE html>
<html>
    <head><title>Typography</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet"></head>
    <style>
        :root {
            font-family: 'Lora', serif;
            font-size: 120%; /* 16px default */
        }
        body {
            font-size: 2rem; /* 16px */
        }
        h1 { font-size: clamp(3.5rem, 5vw, 5.5rem);
        font-weight:400;
    line-height:1.3;
    }
        h2 { font-size: 2.5rem; }
        p  { font-size: 1.125rem;font-weight:700;
        letter-spacing: -0.05em; }
    </style>
    <body>
        <h1>This is a heading</h1>
        <h2>This is a subheading</h2>
        <p> This is a sample paragraph for typography</p>
        <p>This is another sample paragraph for typography</p>
    </body>
</html>
